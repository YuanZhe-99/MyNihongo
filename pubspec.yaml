name: my_nihongo
description: "MyNihongo!!!!! — Your Japanese learning companion"
publish_to: 'none'

version: 0.4.3+10

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Shared WebDAV sync & data-management engines, embedded as a git submodule.
  # The submodule commit is the lockfile — pub does not lock path deps.
  # After a fresh clone: git submodule update --init
  myapps_data:
    path: packages/myapps_data

  # State management
  flutter_riverpod: ^1.0.4

  # Navigation
  go_router: ^14.8.1

  # Theming
  flex_color_scheme: ^8.2.0

  # Icons
  cupertino_icons: ^1.0.8

  # i18n
  intl: ^0.20.2

  # File and directory pickers for ZIP export/import and backup restore.
  # Pinned exactly: see doc/en-us/platform-notes.md — 10.3.7 is the only
  # release that both applies the Kotlin Gradle Plugin itself (required while
  # android.builtInKotlin=false) and compiles against flutter.compileSdkVersion.
  file_picker: 10.3.7

  # On-device speech. The system engines do the work; nothing leaves the device.
  # `speech_to_text` is pinned exactly for the same reason `file_picker` is —
  # see doc/en-us/platform-notes.md.
  flutter_tts: ^4.2.5
  speech_to_text: 7.4.0

  # Local reminders. Nothing here reaches a network: the notification is
  # scheduled by the operating system on the device and its text is built from
  # the progress file. Versions are pinned exactly to the ones MyAnime!!!!!
  # resolved, because that app has the same Gradle state — android
  # .builtInKotlin=false — and these plugins are where a Kotlin Gradle Plugin
  # change would break the Android build without warning. See
  # doc/en-us/platform-notes.md.
  flutter_local_notifications: 19.5.0
  timezone: 0.10.1
  flutter_timezone: 5.1.0
  local_notifier: 0.1.6

  # Utilities
  path: ^1.9.0
  path_provider: ^2.1.5
  package_info_plus: ^9.0.0
  device_preview: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  # Windows Store packaging, for parity with the sibling apps' version
  # locations; no CI job builds an MSIX (see doc/en-us/ci-cd.md).
  msix: ^3.16.8
  image: ^4.8.0
  # Used by the golden sync transcript harness and the backup/ZIP tests, which
  # drive the shared engines directly rather than through the UI.
  http: ^1.6.0
  archive: ^4.0.0
  path_provider_platform_interface: ^2.1.3

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/content/
    - assets/content/grammar/
    - assets/content/lessons/
    - assets/content/prompts/

# Windows MSIX packaging. `msix_version` is one of the version locations listed
# in AGENTS.md and moves with `version:` above.
msix_config:
  display_name: MyNihongo!!!!!
  publisher_display_name: yuanzhe
  identity_name: com.yuanzhe.mynihongo
  msix_version: 0.4.3.0
  logo_path: assets/icon/app_icon.png
  capabilities: internetClient,microphone
  install_certificate: false
